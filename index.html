<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>영양소 검출 실험 수행평가</title>
<style>
  html, body { margin: 0; height: 100%; background: #eef2f4; font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    color: #5f6f7b; text-align: center; padding: 20px; line-height: 1.6; }
  #loading a { color: #1f5c7a; }
  #loading.done { display: none; }
  .err { max-width: 520px; margin: 14vh auto; padding: 26px; background: #fff; border: 1px solid #cdd6dc; border-radius: 14px; color: #1c2a35; line-height: 1.6; }
</style>
</head>
<body>

<div id="loading"><div>불러오는 중…</div><div id="fallback" hidden>오래 걸리면 <a id="direct" href="#">여기</a>를 눌러 주세요.</div></div>
<iframe id="app" title="수행평가"></iframe>

<script>
// ★ 여기 한 줄만 바꾸면 됩니다 ★
// Apps Script ▸ 배포 ▸ 배포 관리 ▸ '웹 앱 URL'을 복사해서 아래 작은따옴표 안에 붙여 넣으세요. (…/exec 로 끝나는 주소)
const APP_URL = 'https://script.google.com/macros/s/AKfycbwfgQWQP4cDtjrc18zvDfOb5_rZcQ2tP6RBBV6w_QepasLeG-y9gqtZvUq4HoypHjhmBw/exec';

(function () {
  var frame = document.getElementById('app');
  if (!APP_URL || APP_URL.indexOf('여기에') >= 0) {
    frame.remove();
    document.getElementById('loading').outerHTML =
      '<div class="err"><h2 style="margin:0 0 8px">주소를 넣어 주세요</h2>index.html 파일 위쪽의 <b>APP_URL</b>을 Apps Script 웹앱 주소(…/exec)로 바꿔 주세요.</div>';
    return;
  }
  // 이 페이지 주소 뒤에 붙은 것(예: ?page=admin)을 그대로 Apps Script 화면에 넘김 → 교사용은 .../?page=admin
  var url = APP_URL + location.search;
  var direct = document.getElementById('direct'); direct.href = url;
  frame.src = url;
  frame.addEventListener('load', function () { document.getElementById('loading').classList.add('done'); });
  setTimeout(function () { document.getElementById('fallback').hidden = false; }, 8000);
})();
</script>
</body>
</html>
